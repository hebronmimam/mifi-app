name: Device report
description: Tried the app on a MiFi or router that isn't listed yet.
labels: [device]
body:
  - type: markdown
    attributes:
      value: |
        To add a box I need one in my hands. You can buy me one of the same model, or post me your own and I'll send it back when the app supports it. Message me on [WhatsApp](https://wa.me/2348149322169) or [Facebook](https://www.facebook.com/hebronmimam) first so we can agree on the details.
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: e.g. ZTE MF927U
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: From the box's own web page, usually under Device information.
  - type: dropdown
    id: result
    attributes:
      label: How it went
      options:
        - Everything works
        - Some things work
        - The app didn't recognise it
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What worked and what didn't
